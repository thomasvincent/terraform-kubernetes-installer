name: Terraform CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform Validation
    runs-on: [self-hosted]

    steps:
      - name: Checkout
        # pinned: actions/checkout@v4
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        # pinned: hashicorp/setup-terraform@v3
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.5.0"

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -backend=false

      - name: Terraform Validate
        id: validate
        run: terraform validate

      - name: Setup TFLint
        # pinned: terraform-linters/setup-tflint@v4
        uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.54.0

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run TFLint
        run: tflint --recursive
        continue-on-error: true

      - name: Run tfsec
        # pinned: aquasecurity/tfsec-action@v1.0.3
        uses: aquasecurity/tfsec-action@b842f53860745310e27e7c3ea6e03bd89271bfff # v1.0.3
        with:
          soft_fail: false

      - name: Run Checkov
        # pinned: bridgecrewio/checkov-action@v12
        uses: bridgecrewio/checkov-action@99bb2cad24db47f50e04b1a81e92e4c1e2ef3e45 # v12.2956.0
        with:
          directory: .
          framework: terraform
          quiet: true
          soft_fail: true

      - name: PR Comment
        if: github.event_name == 'pull_request'
        # pinned: actions/github-script@v7
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        with:
          script: |
            const output = `#### Terraform Format and Style: \`${process.env.FMT_OUTCOME}\`
            #### Terraform Initialization: \`${process.env.INIT_OUTCOME}\`
            #### Terraform Validation: \`${process.env.VALIDATE_OUTCOME}\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
